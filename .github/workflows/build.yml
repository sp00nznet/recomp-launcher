# The launcher itself: vet and test on each OS, and the screens as pictures
# (the screens artifact) from the sample game/launcher.json.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libgl1-mesa-dev xorg-dev xvfb
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: |
          xvfb-run -a go test ./...
          go build -o rl . && xvfb-run -a ./rl --shots screens
      - if: runner.os != 'Linux'
        run: go test ./...
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/*.png
