# One game's installer, from the launcher.json in its repo. A game repo calls
# it (README: "Adding a game"); every run leaves the installers as artifacts,
# and a v* tag puts them on that tag's release.
name: installer

on:
  workflow_call:
    inputs:
      name:
        description: "The installer's file name, without the platform or extension"
        type: string
        required: true
      manifest:
        description: "The folder in the game's repo holding launcher.json"
        type: string
        default: launcher
      launcher-ref:
        description: "The recomp-launcher version to build"
        type: string
        default: main
      platforms:
        description: "Which installers to build: any of windows, linux, macos"
        type: string
        default: windows linux macos

jobs:
  # the build matrix, cut down to the platforms the game's setup supports
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[{"platform":"windows","os":"windows-2022","file":"windows-x64.exe","ldflags":"-H=windowsgui"},
                {"platform":"linux","os":"ubuntu-24.04","file":"linux-x64"},
                {"platform":"macos","os":"macos-14","file":"macos-arm64"}]'
          echo "matrix=$(jq -c --arg p "$PLATFORMS" '{include: [.[] | select(.platform as $x | $p | split(" ") | index($x))]}' <<<"$all")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      OUT: ${{ inputs.name }}-${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sp00nznet/recomp-launcher
          ref: ${{ inputs.launcher-ref }}
      - uses: actions/checkout@v4
        with:
          path: _game
          sparse-checkout: ${{ inputs.manifest }}
      - run: rm -rf game && cp -r "_game/${{ inputs.manifest }}" game
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libgl1-mesa-dev xorg-dev
      # Version info and a manifest in the exe. An unsigned exe with neither,
      # that downloads code and runs PowerShell, is what antivirus heuristics
      # flag (issue themepark-recomp#33); these make it look like what it is.
      - if: runner.os == 'Windows'
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          title=$(jq -r .title game/launcher.json)
          ver=0.0.0.0
          case "$GITHUB_REF" in refs/tags/v*) v=${GITHUB_REF_NAME#v}; v=${v%%-*}; ver="$v.0" ;; esac
          "$(go env GOPATH)/bin/go-winres" simply --arch amd64 --manifest gui --icon none \
            --product-version "$ver" --file-version "$ver" --product-name "$title recomp" \
            --file-description "$title recomp installer" --original-filename "$OUT" \
            --copyright "recomp-launcher contributors"
      # the game repo's commit is the one the installer fetches and builds
      # and the tag, or the short commit off a branch, is the version it shows
      - run: |
          v=${GITHUB_SHA::7}; case "$GITHUB_REF" in refs/tags/v*) v=$GITHUB_REF_NAME ;; esac
          go build -ldflags "-X main.commit=${{ github.sha }} -X main.version=$v ${{ matrix.ldflags }}" -o "out/$OUT" .
      # tar keeps the executable bit, which a plain download loses
      - if: runner.os == 'Linux'
        run: tar -C out -czf "out/$OUT.tar.gz" "$OUT" && rm "out/$OUT"
      # an app, so a double-click doesn't open a terminal
      - if: runner.os == 'macOS'
        run: |
          app="out/${{ inputs.name }}.app"
          mkdir -p "$app/Contents/MacOS"
          mv "out/$OUT" "$app/Contents/MacOS/installer"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>installer</string>
            <key>CFBundleIdentifier</key><string>net.sp00nz.${{ inputs.name }}</string>
            <key>CFBundleName</key><string>${{ inputs.name }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          # ponytail: ad-hoc, not notarised. Unsigned, a downloaded bundle is
          # "damaged" with no way past; ad-hoc gets "Open Anyway" in Privacy & Security
          codesign --force --deep --sign - "$app"
          (cd out && zip -qry "$OUT.zip" "${{ inputs.name }}.app" && rm -rf "${{ inputs.name }}.app")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        # a tag with a hyphen (v0.1.0-alpha.1) is a pre-release
        run: |
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          (cd out && sha256sum -- * > SHA256SUMS.txt)   # so a download can be checked, and looked up
          gh release upload "$GITHUB_REF_NAME" out/* --clobber -R "$GITHUB_REPOSITORY" ||
            gh release create "$GITHUB_REF_NAME" out/* -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre
